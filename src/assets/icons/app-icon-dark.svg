<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Dunkler Hintergrund-Verlauf -->
    <linearGradient id="moonwalker-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#152331" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <!-- Heller Eisblau-Verlauf für das O -->
    <linearGradient id="daywalker-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF0F5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  
  <rect width="1024" height="1024" rx="225" fill="url(#moonwalker-bg)" />
  <circle cx="512" cy="512" r="280" fill="none" stroke="url(#daywalker-stroke)" stroke-width="140" />
</svg>
