<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Der helle Daywalker Gradient von oben links nach unten rechts -->
    <linearGradient id="daywalker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF0F5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  
  <!-- Der Hintergrund (Ein Quadrat mit leichten Rundungen) -->
  <rect width="1024" height="1024" rx="225" fill="url(#daywalker)" />
  
  <!-- Das minimalistische, kraftvolle 'O' im dunklen Moonwalker-Ton (#152331) -->
  <circle cx="512" cy="512" r="280" fill="none" stroke="#152331" stroke-width="140" />
</svg>
