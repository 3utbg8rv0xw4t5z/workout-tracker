<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <!-- Der Daywalker Gradient -->
    <linearGradient id="daywalker" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF0F5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  
  <!-- Das minimalistische 'O' zentriert in der oberen Hälfte -->
  <circle cx="500" cy="380" r="220" fill="none" stroke="url(#daywalker)" stroke-width="110" />
  
  <!-- Der Text zentriert darunter -->
  <text x="50%" y="820" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="150" 
        font-weight="900" 
        letter-spacing="8" 
        fill="url(#daywalker)" 
        text-anchor="middle" 
        dominant-baseline="middle">
    Overload
  </text>
</svg>
