<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="1000" height="250">
  <defs>
    <!-- Der helle Daywalker Gradient von links nach rechts für den Text -->
    <linearGradient id="daywalker-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EBF0F5" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
  </defs>
  
  <!-- Der Text mit dem hellen Gradienten als Füllung (Hintergrund ist transparent) -->
  <text x="50%" y="55%" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-size="160" 
        font-weight="900" 
        letter-spacing="8" 
        fill="url(#daywalker-text)" 
        text-anchor="middle" 
        dominant-baseline="middle">
    Overload
  </text>
</svg>
