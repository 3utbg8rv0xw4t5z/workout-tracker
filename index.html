<!doctype html>
<html lang="de">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="ie=edge" />

  <title>Overload: Fokussiertes Progress Tracking ohne Kompromisse</title>
  <script>
    (function () {
      const isPWA =
        window.matchMedia("(display-mode: standalone)").matches ||
        window.matchMedia("(display-mode: window-controls-overlay)").matches ||
        window.navigator.standalone === true;

      document.title = "Overload: Fokussiertes Progress Tracking ohne Kompromisse";
    })();
  </script>

  <meta name="color-scheme" content="dark light" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no" />
  <meta name="description"
    content="Overload: Fokussiertes Progress Tracking ohne Kompromisse. Die Smart Fitness App befindet sich in aktiver Entwicklung. Bald verfügbar!" />

  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Overload" />

  <link rel="icon" type="image/x-icon" href="src/assets/icons/favicon.ico" />
  <link rel="icon" type="image/svg+xml" href="src/assets/icons/favicon-dark.svg" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/svg+xml" href="src/assets/icons/favicon-light.svg"
    media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="192x192" href="src/assets/icons/favicon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="src/assets/icons/favicon-512.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="src/assets/icons/apple-touch-icon.png" />

  <link rel="manifest" href="manifest.json" />

  <meta name="msapplication-TileColor" content="#152331" />
  <meta id="meta-theme-light" name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
  <meta id="meta-theme-dark" name="theme-color" content="#152331" media="(prefers-color-scheme: dark)" />

  <link rel="stylesheet" href="src/css/style.css" />

  <style>
    /* Viewport fixiert */
    html,
    body {
      height: 100vh;
      height: 100dvh;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      box-sizing: border-box;
      touch-action: none;
      background: var(--body-bg, linear-gradient(135deg, #152331 0%, #000000 100%));
      color: var(--text-main, #f8fafc);
    }

    /* Relative Stage für absolute Platzierung */
    .showcase-stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 1. Badge oben (30px Abstand) */
    .status-badge {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.2rem 0.65rem;
      border-radius: 9999px;
      background: rgba(74, 222, 128, 0.06);
      border: 1px solid rgba(74, 222, 128, 0.2);
      color: #4ade80;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      white-space: nowrap;
      z-index: 10;
    }

    .status-badge .material-symbols-rounded {
      font-size: 13px;
      color: #4ade80;
      animation: pulse-green-glow 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-green-glow {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.7;
        filter: drop-shadow(0 0 2px rgba(74, 222, 128, 0.3));
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
        filter: drop-shadow(0 0 6px rgba(74, 222, 128, 0.8));
      }
    }

    /* 2. Logo exakt im mathematischen Zentrum */
    .brand-logo-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      max-width: 360px;
      width: 80%;
      height: auto;
      filter: drop-shadow(0 0 28px rgba(56, 189, 248, 0.3));
      z-index: 5;
      pointer-events: none;
      user-select: none;
    }

    /* GitHub FAB Button im hellen Daywalker-Look */
    .btn-github-bottom {
      position: absolute;
      bottom: 30px;
      right: 30px;
      left: auto;
      transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      width: auto;
      height: auto;
      padding: 0.5rem 0.95rem;
      border-radius: 9999px;

      /* Daywalker Gradient: Clean White / Subtle Light Slate */
      background: linear-gradient(135deg, #ffffff 0%, #e2e8f0 100%);
      color: #0b0f19;
      border: 1px solid rgba(255, 255, 255, 0.8);
      font-weight: 600;
      font-size: 0.75rem;
      line-height: 1;
      text-decoration: none;
      white-space: nowrap;

      /* Weicher, edler Daywalker Glow */
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.18), 0 2px 6px rgba(0, 0, 0, 0.3);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
    }

    .btn-github-bottom:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3), 0 3px 8px rgba(0, 0, 0, 0.4);
      color: #000000;
    }

    .btn-github-bottom .material-symbols-rounded {
      font-size: 16px;
      line-height: 1;
      color: #0b0f19;
    }
  </style>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Overload: Fokussiertes Progress Tracking ohne Kompromisse",
      "alternateName": "Overload",
      "applicationCategory": "HealthAndFitnessApplication",
      "operatingSystem": "Android, iOS, Web",
      "description": "Smart Fitness App in aktiver Entwicklung. Fokussiertes Progress Tracking ohne Kompromisse.",
      "url": "https://3utbg8rv0xw4t5z.github.io/overload-website/"
    }
  </script>
</head>

<body>
  <div id="page-preloader"></div>

  <main class="showcase-stage">
    <div class="status-badge">
      <span class="material-symbols-rounded">terminal</span>
      In aktiver Entwicklung
    </div>

    <img src="src/assets/icons/logo-text-light.svg" alt="Overload Logo" class="brand-logo-center" />

    <a href="https://github.com/3utbg8rv0xw4t5z/overload-website" target="_blank" rel="noopener noreferrer"
      class="btn-github-bottom" title="Projekt auf GitHub ansehen" aria-label="Projekt auf GitHub ansehen">
      <span class="material-symbols-rounded">code</span>
    </a>
  </main>

  <script src="src/js/script.js" defer></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then((registration) => {
            console.log("[SW] Registriert:", registration.scope);
          })
          .catch((error) => {
            console.error("[SW] Registrierungsfehler:", error);
          });
      });
    }
  </script>
</body>

</html>
