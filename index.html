      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);

      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }

    .status-badge .material-symbols-rounded {
      font-size: 15px;
      color: #38bdf8;
      animation: pulse-glow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-glow {

      0%,
      100% {
        transform: scale(1);
        opacity: 0.8;
        filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.4));
      }

      50% {
        transform: scale(1.15);
        opacity: 1;
        filter: drop-shadow(0 0 8px rgba(56, 189, 248, 0.9));
      }
    }

    .construction-text {
      color: var(--text-muted, #94a3b8);
      font-size: 0.92rem;
      line-height: 1.55;
      max-width: 420px;
      margin: 0 0 1.5rem 0;

      justify-content: center;

      background: var(--brand-accent-gradient, linear-gradient(135deg, #38bdf8 0%, #0284c7 100%));

      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      text-decoration: none;
      transition: all 0.25s ease;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);

      box-shadow: 0 6px 16px rgba(56, 189, 248, 0.38);
      filter: brightness(1.06);
